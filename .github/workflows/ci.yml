name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# ── Global env ───────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Lint & vet (runs on every PR and push) ───────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      # gofmt: exits non-zero if any file would change.
      - name: gofmt check
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then
            echo "The following files need gofmt:"
            echo "$bad"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint bundles many linters (errcheck, staticcheck, gosec, …).
      # Pinned to a specific version for reproducibility.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m
          skip-cache: true

  # ── 2. Test (runs on every PR and push) ─────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    # Spin up real Postgres and Redis for integration-style repository tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urlshortener
          POSTGRES_PASSWORD: urlshortener
          POSTGRES_DB: urlshortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlshortener -d urlshortener"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # These match the service containers above.
      DATABASE_URL: postgres://urlshortener:urlshortener@localhost:5432/urlshortener?sslmode=disable
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      JWT_SECRET: ci-test-secret
      JWT_EXPIRY: 24h
      BCRYPT_COST: "4"          # Low cost so bcrypt doesn't slow tests.
      RATE_LIMIT_PER_MINUTE: "60"
      CACHE_TTL: 1h
      HTTP_ADDR: :8080
      REQUEST_TIMEOUT: 5s
      SHUTDOWN_TIMEOUT: 10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      # Apply migrations so the DB schema is ready before tests run.
      - name: Run migrations
        run: |
          go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3 \
            -path ./migrations \
            -database "$DATABASE_URL" \
            up

      # -race detects data races; -coverprofile lets us upload coverage later.
      - name: go test -race -cover
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  # ── 3. Build & push Docker image (push to main only) ────────────────────────
  docker:
    name: Docker
    needs: [lint, test]          # Only build if lint and tests pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # Required to push to GHCR.

    steps:
      - uses: actions/checkout@v4

      # Docker Buildx enables BuildKit and multi-platform builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for image tags:
      # - latest on main
      # - sha-<commit> for exact tracing
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GitHub Actions cache to speed up subsequent builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
