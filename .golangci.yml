# golangci-lint v2 configuration.
# Keep the enabled set small and deliberate — every linter here
# catches a real class of bug or style issue.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck      # flag unchecked errors
    - govet         # go vet checks
    - ineffassign   # dead assignments
    - staticcheck   # comprehensive static analysis
    - unused        # unused code
    - gosec         # security issues (SQL injection, weak crypto, …)
    - misspell      # common spelling mistakes in comments/strings
  settings:
    gosec:
      # G401/G501 flag weak hash functions; we only use sha256+bcrypt, so these
      # would fire on test helpers. Keep them enabled — fix, don't suppress.
      excludes: []

formatters:
  enable:
    - gofmt

issues:
  # Raise the per-linter limit so we see all issues at once.
  max-issues-per-linter: 50
  max-same-issues: 10
